# A7 ablation grid (shuffle-seed sensitivity sweep; Section VIII-C).
#
# Sweep: training shuffle seed ∈ {42, 7, 1729, 0xDEAD, 0xBEEF}
#        × 2 columns = 10 probes (deliberately narrow: A7 is a
#        seed-robustness check, not a main result). Each cell compresses the
#        FULL materialised column with everything held at the headline
#        config (bits=16, DynamicThreshold{0.15}); ONLY the seed varies. Output: R
#        (ratio). T_c (compress time) is a secondary diagnostic. The
#        affirmative claim is that R barely moves across seeds.
#
# 0xDEAD = 57005, 0xBEEF = 48879 (decimal here so YAML parses them as ints).
#
# A7 reuses the existing `compress` runner op (the `seed` cfg knob already
# exists, default 42) — NO new op, NO upstream OnPair change. Like A2 this is a
# FULL-column experiment (no held-out split); unlike A2 it is compress-only
# (no bulk_decode — A7's only y-axis is R). See schema/a7_results.sql header.
#
# Smoke: single cell (seed=7, a NON-default, to prove the seed knob is wired)
# × synthetic fixture, used whole (no split). Runs in <1 sec.
#
# Full grid (NOT exercised by `make a7-smoke`; requires `make datasets`
# first; runs via `make a7`):

seeds: [42, 7, 1729, 57005, 48879]
bits: 16
sample_fraction: 0.15
mem_cap_gb: 64

columns:
  - { dataset: amazon,       column: titles }
  - { dataset: msmarco_urls, column: url }

smoke:
  # Single-cell A7 smoke: seed=7 (non-default → proves the seed cfg actually
  # reaches the DynamicThreshold shuffle) against the synthetic fixture
  # (1000 rows @ L=32, σ=16, ρ=0.7), used as the full column (no split — A7 is
  # a full-column experiment). No real-data dependency.
  fixture_path: testdata/datasets/synthetic_vd__L32_sigma16_rho0.7_seed42_n1000.fixture.col
  seed: 7
  dataset: synthetic_vd_smoke_fixture
  column:  L32_sigma16_rho0.7
