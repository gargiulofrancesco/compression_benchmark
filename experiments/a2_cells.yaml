# step 4 — A2 ablation grid (bit-width sweep).
#
# Sweep: BitWidth b ∈ {9, 10, 12, 14, 16} × 6 headline columns = 30 probes
# (.7 row A2). Each cell compresses the FULL materialised column
#        at bit-width b with the headline strategy held constant
#        (DynamicThreshold{0.15}, seed=42) and then bulk-decodes it. Outputs:
#        R (ratio), T_d (decode time), |D| (dict_bytes). T_c (compress time) is
# a secondary diagnostic. bits=16 is the headline default and
# bits=14 the size-matched BPE-pairing cell, so the sweep brackets both.
#
# A2 reuses the existing `compress` + `bulk_decode` runner ops (NO new op, NO
# upstream OnPair change) — see schema/a2_results.sql header for the rationale.
# Unlike A1/A3 this is a FULL-column experiment (no held-out split).
#
# (Roster: the paper's high-cardinality headline columns;
#  restricted to the paper's six headline columns.)
#
# Smoke: single cell (b=12 × V-D fixture, used whole — no split). Runs in <1 sec.
#
# Headline grid (NOT exercised by `make a2-smoke`; requires `make datasets`
# first; runs via `make a2` on a measurement rig only):

bit_widths: [9, 10, 12, 14, 16]
sample_fraction: 0.15
seed: 42
mem_cap_gb: 64

columns:
  - { dataset: dbpedia,         column: abstract }
  - { dataset: msmarco_urls,    column: url }
  - { dataset: msmarco_queries, column: query }
  - { dataset: amazon,          column: titles }
  - { dataset: tpch,            column: p_name }
  - { dataset: tpch,            column: c_comment }

smoke:
  # Single-cell A2 smoke: b=12 against the V-D synthetic fixture (1000 rows
  # @ L=32, σ=16, ρ=0.7), used as the full column (no split — A2 is a
  # full-column experiment). No real-data dependency.
  fixture_path: testdata/datasets/synthetic_vd__L32_sigma16_rho0.7_seed42_n1000.fixture.col
  bits: 12
  dataset: synthetic_vd_smoke_fixture
  column:  L32_sigma16_rho0.7
