# A4 ablation grid (capacity sweep with timings and training memory).
#
# Sweep: capacity ∈ {2⁹, 2¹², 2¹⁴, 2¹⁶} × 6 headline columns = 24 probes.
#        capacity ≡ 2^bits (OnPair has no independent
#        capacity knob; TrainingConfig defines max dict size = 2^bits — see
#        schema/a4_results.sql header), so the sweep is over `bit_widths`
#        [9, 12, 14, 16] and capacity = 1<<b is derived. Each cell compresses
#        the FULL materialised column at capacity 2^b with the headline strategy
#        held constant (DynamicThreshold{0.15}, seed=42) and then bulk-decodes
#        it. Outputs: R (ratio), T_d (decode time), M_train (peak RSS during
#        encode). |D| (dict_bytes) and T_c are secondary diagnostics. bits=16 is
# the headline default and bits=14 the size-matched BPE-pairing cell, so the
#        sweep brackets both.
#
# A4 reuses the existing `compress` + `bulk_decode` runner ops (NO new op, NO
# upstream OnPair change). M_train is captured in pure Python: the compress op
# runs in its own short-lived process whose peak RSS is read via os.wait4 after
# it exits, with bulk_decode in a separate process — see a4_driver.py / the
# schema header for the rationale. Like A2 this is a FULL-column experiment
# (no held-out split).
#
# (Columns: the paper's six headline columns.)
#
# Smoke: single cell (capacity=2¹²=4096 × synthetic fixture, used whole). <1 sec.
#
# Full grid (NOT exercised by `make a4-smoke`; requires `make datasets`
# first; runs via `make a4`):

bit_widths: [9, 12, 14, 16]   # capacity = 1<<b ∈ {512, 4096, 16384, 65536}
sample_fraction: 0.15
seed: 42
mem_cap_gb: 64

columns:
  - { dataset: dbpedia,         column: abstract }
  - { dataset: msmarco_urls,    column: url }
  - { dataset: msmarco_queries, column: query }
  - { dataset: amazon,          column: titles }
  - { dataset: tpch,            column: p_name }
  - { dataset: tpch,            column: c_comment }

smoke:
  # Single-cell A4 smoke: capacity=2¹²=4096 (bits=12) against the synthetic
  # fixture (1000 rows @ L=32, σ=16, ρ=0.7), used as the full column (no split —
  # A4 is a full-column experiment). No real-data dependency.
  fixture_path: testdata/datasets/synthetic_vd__L32_sigma16_rho0.7_seed42_n1000.fixture.col
  bits: 12
  dataset: synthetic_vd_smoke_fixture
  column:  L32_sigma16_rho0.7
