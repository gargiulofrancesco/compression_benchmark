# step 3 — A3 ablation grid (sample_fraction sweep).
#
# Sweep: DynamicThreshold sample_fraction ∈ {0.05, 0.15, 0.30, 0.60, 1.0}
# × 6 headline columns = 30 single-strategy probes.
# Each cell trains ONE DynamicThreshold{f} dictionary on the column's train
# split (seed=42, bits=16) and encodes the held-out split with it. Output:
# held-out ratio R + compression time T_c (train_ns + encode_ns). No Fixed
# pairing — that is A1 (a1_cells.yaml). 0.15 is the headline default,
# so A3 brackets it on both sides; 1.0 = train on the full column.
#
# (Roster: the paper's high-cardinality headline columns;
#  restricted to the paper's six headline columns.)
#
# Smoke: single cell (f=0.30 × V-D fixture, split inline via the
# orchestrator.heldout splitter). Runs in <1 sec.
#
# Headline grid (NOT exercised by `make a3-smoke`; requires `make datasets`
# first; runs via `make a3` on a measurement rig only):

sample_fractions: [0.05, 0.15, 0.30, 0.60, 1.0]
bits: 16
seed: 42
mem_cap_gb: 64

columns:
  - { dataset: dbpedia,         column: abstract }
  - { dataset: msmarco_urls,    column: url }
  - { dataset: msmarco_queries, column: query }
  - { dataset: amazon,          column: titles }
  - { dataset: tpch,            column: p_name }
  - { dataset: tpch,            column: c_comment }

smoke:
  # Single-cell A3 smoke: f=0.30 against the V-D synthetic fixture (1000 rows
  # @ L=32, σ=16, ρ=0.7). No real-data dependency; the held-out splitter
  # slices into train (800) + heldout (200) at run time.
  fixture_path: testdata/datasets/synthetic_vd__L32_sigma16_rho0.7_seed42_n1000.fixture.col
  sample_fraction: 0.30
  dataset: synthetic_vd_smoke_fixture
  column:  L32_sigma16_rho0.7
