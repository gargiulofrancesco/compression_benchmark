datasets:
- name: tpch
  kind: real
  source:
    url: duckdb-extension:tpch
    sha256: n/a  # data generated locally by DuckDB's tpch extension (SF=10)
    license_id: TPC-academic
  subset:
    sf: 10
  columns:
  - name: l_comment
    output_filename: l_comment.col
    field_index_or_path: lineitem.l_comment
    approx_rows: 60000000
    approx_bytes: 1600000000
  - name: p_name
    output_filename: p_name.col
    field_index_or_path: part.p_name
    approx_rows: 2000000
    approx_bytes: 50000000
    headline: true        # high-cardinality (U/N=1.0); DB anchor
  - name: c_address
    output_filename: c_address.col
    field_index_or_path: customer.c_address
    approx_rows: 1500000
    approx_bytes: 38000000
  - name: c_comment
    output_filename: c_comment.col
    field_index_or_path: customer.c_comment
    approx_rows: 1500000
    approx_bytes: 120000000
    headline: true        # high-cardinality (U/N=0.94); DB anchor
  - name: s_comment
    output_filename: s_comment.col
    field_index_or_path: supplier.s_comment
    approx_rows: 100000
    approx_bytes: 12000000
  extractor: tools.datasets.tpch
  held_out:
    fraction: 0.2
    split_seed: 42
  output_sha256:
    l_comment: 9ea2e8ccdad4efde1b22268d48d13849a15745c7e70cec0b375d6c0553435480
    p_name: e5132bd82ce8a5c508c93709a35cd237ae957cbba19bc74a13dffd85f48963af
    c_address: 183031827bc66e21e539016f67594554982cf37578b421d97c4d3ab55df28820
    c_comment: dbea0be0c13570419fd741c64e7faff60867f5f839ce98ada7142a79bc184b3e
    s_comment: 81fe058350772ca090d169ffade0a1f5bc980ee3efec51a40db87291f7603a62
  smoke_fixture:
    sf_fixture: 0.01
    columns:
      l_comment: testdata/datasets/tpch__l_comment.fixture.col
      p_name: testdata/datasets/tpch__p_name.fixture.col
- name: dblp
  kind: real
  source:
    url: https://dblp.org/xml/dblp.xml.gz
    sha256: rolling  # dblp.xml.gz is a rolling snapshot; recorded at fetch
                     # time by tools/datasets/prepare.py --update-checksums
    license_id: ODC-BY
  subset: null
  columns:
  - name: titles
    output_filename: titles.col
    field_index_or_path: title
    approx_rows: 7000000
    approx_bytes: 400000000
    # Not a headline column: measured uniqueness U/N=0.645 on the full dump
    # (republished/duplicate titles), below the high-cardinality bar the
    # headline roster requires.
    headline: false
  - name: authors
    output_filename: authors.col
    field_index_or_path: author
    approx_rows: 7000000
    approx_bytes: 240000000
  extractor: tools.datasets.dblp
  held_out:
    fraction: 0.2
    split_seed: 42
  output_sha256:
    titles: 3a9aa3c7835e068eed47b9929960a71954ef6ae0b3422e2f33dd367328d433f5
    authors: fffde68593dc7203dc0fd088f719ac89851b302c265b62879c433c2bc0114852
  smoke_fixture:
    raw: testdata/datasets/dblp__dump.raw.fixture.xml
    columns:
      titles: testdata/datasets/dblp__titles.fixture.col
      authors: testdata/datasets/dblp__authors.fixture.col
# --- High-cardinality headline columns ---
# Native sizes (no capping) except DBpedia, capped to the 1M-abstract subset.
- name: amazon
  kind: real
  source:
    url: https://mcauleylab.ucsd.edu/public_datasets/data/amazon_2023/raw/meta_categories/meta_Books.jsonl.gz
    sha256: recorded-at-fetch  # see tools/datasets/prepare.py --update-checksums
    license_id: amazon-reviews-2023-research
  subset: null
  columns:
  - name: titles
    output_filename: titles.col
    field_index_or_path: title
    approx_rows: 4450000
    approx_bytes: 240000000
    headline: true      # Amazon Books title metadata, kept in ORIGINAL file
                        # order (datasets are never shuffled or sorted).
                        # Measured: U/N=0.869, Lavg=52, LCP_avg=17.
  extractor: tools.datasets.amazon
  held_out:
    fraction: 0.2
    split_seed: 42
  output_sha256:
    titles: e5c8b179844ae7f37c47c9991e898836bbc7843e725919b6f6ec91158a09dbd5
- name: dbpedia
  kind: real
  source:
    url: https://databus.dbpedia.org/dbpedia/text/short-abstracts/2022.12.01/short-abstracts_lang=en.ttl.bz2
    sha256: e4793027fabd922948763794c4643b07729d207bb537fc766a15961aa711efdd
    license_id: CC-BY-SA-4.0
  subset:
    limit: 1000000          # subset (the only capped dataset)
  columns:
  - name: abstract
    output_filename: abstract.col
    field_index_or_path: ntriples-object
    approx_rows: 1000000
    approx_bytes: 340000000
    headline: true          # high-cardinality (U/N=0.998); long text — OnPair showcase
  extractor: tools.datasets.dbpedia
  held_out:
    fraction: 0.2
    split_seed: 42
  output_sha256:
    abstract: 3d30bec601891e3a3630311bae62a3e21f903f2d2a57b19fe02337ce800f88df
