# A5 ablation grid (block-size sweep vs random-access latency; Section VIII-E).
#
# Sweep: block size ∈ {64, 256, 1K, 4K, 16K, 64K} strings,
#        x = block size, y = L_ra p50/p95/p99, datasets = MS MARCO URL +
#        TPC-H c_comment, cache = cold + warm.
#
# CROSS-BASELINE DESIGN: OnPair has NO block knob
# (decompress(idx) seeks per-string via the global boundaries — Section V, O(|s_i|)),
# so block size cannot move OnPair's L_ra. A5 therefore sweeps block size on the
# BLOCK-BASED baselines (zstd, lz4 — each must decode the enclosing block to
# answer one point query, so their L_ra degrades as block size grows) and plots
# OnPair as a single FLAT reference line (block-independent). RLZ is excluded:
# its block_size is fixed at 16384 and cannot sweep. See
# schema/a5_results.sql for the full design note.
#
# Each (baseline, dataset, column, block_size, cache_state) cell: compress the
# FULL column with the baseline at that block size (block_strings knob on
# zstd/lz4), then run the `ra_latency` op (n_samples uniform random accesses,
# no file I/O in the timed loop) → p50/p95/p99. The flat baseline (onpair) runs
# once per (dataset, column, cache_state) with block_size_strings = NULL.
#
# Grid: 2 cols × 6 block sizes × 2 block-based baselines × 2 cache states = 48
#       block cells + 2 cols × 2 cache states × 1 flat baseline = 4 OnPair cells.
# Real-data only (requires `make datasets`); runs via `make a5`. Latencies
# need x86-64 with the performance governor and turbo off (refused-env
# otherwise). NOT part of `make smoke`.

block_sizes:    [64, 256, 1024, 4096, 16384, 65536]
baselines:      [zstd, lz4]        # block-based; block size sweeps
flat_baseline:  onpair             # block-independent flat reference line
cache_states:   [warm, cold]
n_samples:      20000   # 1e6 -> 2e4 — at 64K-string blocks one access decodes ~MB (ms-scale); 2e4 gives stable p50/p95/p99 and keeps the grid tractable. Stated in Section VIII-E.
seed:           42
query_distribution: uniform

columns:
  - { dataset: msmarco_urls, column: url }
  - { dataset: tpch,         column: c_comment }

smoke:
  # Single warm probe each for a block-based baseline (zstd @ block=256) and the
  # flat baseline (onpair) against the committed synthetic fixture (1000 rows), used
  # whole. n_samples kept tiny so the smoke runs in <1 sec. No real-data dep.
  fixture_path: testdata/datasets/synthetic_vd__L32_sigma16_rho0.7_seed42_n1000.fixture.col
  dataset: synthetic_vd_smoke_fixture
  column:  L32_sigma16_rho0.7
  block_baseline: zstd
  block_size: 256
  cache_state: warm
  n_samples: 2000
